# ═══════════════════════════════════════════════════════════════
#  Neo — Configuration Nginx
#  - Sert les fichiers statiques React (SPA)
#  - Proxy WebSocket Socket.IO  → backend:8000
#  - Proxy API REST              → backend:8000
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # ── Compression Gzip ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Assets statiques (cache agressif) ────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Socket.IO — OBLIGATOIRE : upgrade WebSocket ───────────
    # Le timeout 86400s maintient les connexions WS ouvertes toute la journée.
    location /socket.io/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API REST Flask ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── SPA Fallback — toutes les routes React ────────────────
    # Renvoie index.html pour que React Router gère la navigation côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
