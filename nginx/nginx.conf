# ═══════════════════════════════════════════════════════════════
#  Neo — Configuration Nginx
#  - Sert les fichiers statiques React (SPA)
#  - Proxy WebSocket Socket.IO  → backend:8000
#  - Proxy API REST              → backend:8000
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # ── DNS resolver interne Docker ───────────────────────────
    # 127.0.0.11 = serveur DNS interne de Docker Compose.
    # Obligatoire pour résoudre les noms de services (ex: "backend")
    # à la requête plutôt qu'au démarrage de Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Compression Gzip ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Assets statiques (cache agressif) ────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Socket.IO — OBLIGATOIRE : upgrade WebSocket ───────────
    location /socket.io/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API REST Flask ────────────────────────────────────────
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── SPA Fallback — toutes les routes React ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
